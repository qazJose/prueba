<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz Cumpleaños ❤️</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">
    <canvas id="canvas"></canvas>

    <!-- ENVOLTORIO PRINCIPAL -->
    <div class="envelope-wrapper" id="envelope-wrapper">
      
      <!-- CONTENEDOR DEL SOBRE Y CARTA -->
      <div class="envelope-container">
        
        <!-- CARTA/TARJETA -->
        <div class="card" id="card">
          <h2>Para mi pedacito de cielo en la tierra: 🌺</h2>
          <p id="typed-text"></p>
        </div>

        <!-- SOBRE -->
        <div class="envelope" id="envelope">
          <div class="front flap"></div>
          <div class="front pocket"></div>
          <div class="heart-seal">❤️</div>
        </div>

      </div>

      <!-- CONTADOR DEBAJO DEL SOBRE -->
      <div class="countdown-box" id="countdown-box">
        <span id="countdown-title">Esperando tu cumple en...</span>
        <div id="countdown">00d 00h 00m 00s</div>
      </div>

    </div>
  </div>

  <script src="java/scripts.js"></script>
</body>
</html>
